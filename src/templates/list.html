<!DOCTYPE html>
<html>
<head>
    <title>PMS - Parking Availability</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h2 {
            margin-top: 20px;
        }

        /* NAV BUTTONS */
        .nav {
            position: absolute;
            left: 20px;
            top: 20px;
        }

        .nav button {
            width: 120px;
            height: 40px;
            margin-right: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav button.active {
            background: black;
            color: white;
        }

        /* TABLE */
        table {
            margin: 40px auto;
            border-collapse: collapse;
            width: 70%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
            font-size: 16px;
        }

        td {
            font-size: 15px;
        }

        /* PROGRESS BAR */
        .percent-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .percent-fill {
            height: 100%;
            background: green;
            color: white;
            font-size: 12px;
            text-align: right;
            padding-right: 5px;
            line-height: 20px;
        }

    </style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <button class="active">List View</button>
    <button onclick="location.href='/map'">Map View</button>
</div>

<h2>Parking Availability</h2>

<table>
    <thead>
        <tr>
            <th>Lot</th>
            <th>Spaces Available</th>
            <th>Percent Full</th>
            <th>Last Updated</th>
        </tr>
    </thead>

    <tbody id="tableBody">
        <tr>
            <td colspan="4">Loading...</td>
        </tr>
    </tbody>
</table>

<script>
async function updateTable() {
    try {
        const res = await fetch("/data");
        const data = await res.json();

        const table = document.getElementById("tableBody");
        table.innerHTML = "";

        if (!data.system_active) {

          const row = `
              <tr>
                  <td>Main Lot</td>
                  <td>-- / --</td>
                  <td>
                      <div class="percent-bar">
                          <div class="percent-fill" style="width:0%">
                              --
                          </div>
                      </div>
                  </td>
                  <td>System Offline</td>
              </tr>
          `;

          table.innerHTML = row;
          return;
      }

        const percentFull = Math.round(
            (1 - data.available / data.total) * 100
        );

        const now = new Date().toLocaleTimeString();

        const row = `
            <tr>
                <td>Main Lot</td>
                <td>${data.available} / ${data.total}</td>
                <td>
                    <div class="percent-bar">
                        <div class="percent-fill" style="width:${percentFull}%">
                            ${percentFull}%
                        </div>
                    </div>
                </td>
                <td>${now}</td>
            </tr>
        `;

        table.innerHTML = row;

    } catch (err) {
        document.getElementById("tableBody").innerHTML = `
            <tr>
                <td colspan="4">Error loading data</td>
            </tr>
        `;
    }
}

setInterval(updateTable, 2000);
updateTable();
</script>

</body>
</html>
